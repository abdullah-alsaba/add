<title>Be My Valentine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: one centered sticker card on a cream ground; three screens (ask, plan, confirmed) swap inside it. Single committed look. */
:root{
  --ground:#f4efdc; --card:#fbf9f2; --ink:#1b1712; --pink:#f0306e; --blue:#0b2fe0; --gold:#ffd21f; --blue-soft:#a9bdf2; --paper:#fbf1cf;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;padding-block:24px;display:grid;place-items:center;min-height:100vh;box-sizing:border-box}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px}
.badge{background:var(--gold);border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;font:800 12px var(--display);box-shadow:0 3px 0 var(--ink)}
.card{position:relative;width:100%;box-sizing:border-box;background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:22px 20px 24px;overflow:hidden}
.screen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.pill{background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font:700 11px var(--body);box-shadow:0 2px 0 var(--ink)}
h1{margin:0;font:800 clamp(34px,10vw,42px)/1.02 var(--display);letter-spacing:-.02em;text-wrap:balance}
h1 .my{color:var(--pink)} h1 .val{color:var(--blue)}
h2{margin:0;font:800 30px/1.1 var(--display);color:var(--pink);letter-spacing:-.01em}
.heart{width:120px;height:auto;animation:bob 2.4s ease-in-out infinite}
.heart.sm{width:104px}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}

/* ask arena */
.arena{position:relative;width:100%;height:92px;margin-top:6px}
.btn{font:800 17px var(--display);border:2.5px solid var(--ink);border-radius:999px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.yes{position:absolute;left:0;top:50%;translate:0 -50%;background:var(--pink);color:#fff;padding:12px 26px;transform-origin:left center}
.no{position:absolute;background:var(--card);padding:10px 20px;font-size:15px;transition:left .35s cubic-bezier(.3,1.5,.5,1),top .35s cubic-bezier(.3,1.5,.5,1),font-size .2s,padding .2s;white-space:nowrap}

/* plan form */
form{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
label,.lbl{font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#5a544a;margin-top:8px}
input[type=date],input[type=time]{width:100%;box-sizing:border-box;font:700 15px var(--body);color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:11px 14px;box-shadow:0 2px 0 var(--ink);min-height:46px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chip{font:700 13.5px var(--body);color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 6px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.chip:active{transform:translateY(2px)}
.chip[aria-pressed=true]{background:var(--pink);color:#fff}
.go{margin-top:14px;width:100%;padding:13px;font-size:16px;background:var(--blue);color:#fff}
.go:disabled{background:var(--blue-soft);color:#e9eefc;cursor:not-allowed;box-shadow:0 4px 0 #6b7ba6;border-color:#4b5576}

/* ticket */
.ticket{width:100%;box-sizing:border-box;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:6px 14px;text-align:left}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0}
.row+.row{border-top:2px dashed #b9ab7a}
.row dt{font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#5a544a}
.row dd{margin:0;font:800 14.5px var(--body);text-align:right}
.note{margin:0;font:700 14px var(--body)}
.again{background:var(--blue);color:#fff;padding:11px 26px;font-size:16px}

.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border:2px solid var(--ink);border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
.screen{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hrt" viewBox="0 0 140 130">
    <path d="M70 118C28 88 8 62 8 40 8 22 22 10 40 10c12 0 22 6 30 17C78 16 88 10 100 10c18 0 32 12 32 30 0 22-20 48-62 78z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M70 114C32 86 14 62 14 42 14 26 26 16 41 16c11 0 21 6 29 17 8-11 18-17 29-17 15 0 27 10 27 26 0 20-18 44-56 72z" fill="#e8263a" stroke="#b5142a" stroke-width="2"/>
    <path d="M30 34c4-8 12-12 20-10" stroke="#ff8a8f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M20 66c-8 2-12-6-6-12M120 66c8 2 12-6 6-12" stroke="#e8263a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <ellipse cx="55" cy="62" rx="5.5" ry="7" fill="#1b1712"/><ellipse cx="85" cy="62" rx="5.5" ry="7" fill="#1b1712"/>
    <circle cx="57" cy="59" r="2" fill="#fff"/><circle cx="87" cy="59" r="2" fill="#fff"/>
    <path d="M62 75q8 8 16 0" stroke="#1b1712" stroke-width="3" fill="#7a1020" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="44" cy="74" rx="6" ry="3.5" fill="#ff7b86" opacity=".7"/><ellipse cx="96" cy="74" rx="6" ry="3.5" fill="#ff7b86" opacity=".7"/>
    <path d="M118 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd21f"/>
    <path d="M18 100l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffd21f"/>
    <path d="M112 104l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#ffd21f"/>
  </symbol>
</svg>

<main class="wrap">
  <div class="badge">Made with love</div>
  <section class="card" id="card" aria-live="polite"></section>
</main>

<script>
(function () {
  var card = document.getElementById('card');
  var heart = function (cls) { return '<svg class="heart ' + (cls || '') + '" viewBox="0 0 140 130" role="img" aria-label="A happy heart"><use href="#hrt"/></svg>'; };
  var PLANS = [['Dinner', '🍝'], ['Movie night', '🎬'], ['Coffee', '☕'], ['Walk', '🌳'], ['Picnic', '🧺'], ['Surprise me', '✨']];
  var NO = ['No', 'Think again!', 'Pretty please?', 'Are you sure?', 'Really?', 'Last chance!', 'Pleeease?', 'You can’t say no'];
  var noCount = 0;

  function ask() {
    noCount = 0;
    card.innerHTML =
      '<div class="screen">' +
        '<span class="pill">For Valentine’s Day</span>' +
        '<h1>Will you be <span class="my">my</span> <span class="val">Valentine?</span></h1>' +
        heart() +
        '<div class="arena" id="arena">' +
          '<button class="btn yes" id="yes" type="button">Yes 💕</button>' +
          '<button class="btn no" id="no" type="button" style="right:0;top:50%;translate:0 -50%">No</button>' +
        '</div>' +
      '</div>';
    var yes = document.getElementById('yes'), no = document.getElementById('no'), arena = document.getElementById('arena');
    yes.addEventListener('click', plan);
    function dodge(e) {
      if (e && e.type === 'click') e.preventDefault();
      noCount++;
      no.textContent = NO[Math.min(noCount, NO.length - 1)];
      var scale = Math.max(0.55, 1 - noCount * 0.07);
      no.style.fontSize = (15 * scale) + 'px';
      no.style.padding = (10 * scale) + 'px ' + (20 * scale) + 'px';
      yes.style.transform = 'scale(' + Math.min(1.45, 1 + noCount * 0.07) + ')';
      var aw = arena.clientWidth, ah = arena.clientHeight;
      var bw = no.offsetWidth, bh = no.offsetHeight, yw = yes.offsetWidth * Math.min(1.45, 1 + noCount * 0.07);
      var minX = yw + 12, maxX = Math.max(minX, aw - bw);
      var x = minX + Math.random() * (maxX - minX);
      var y = Math.random() * (ah - bh);
      no.style.translate = '0 0'; no.style.right = 'auto'; no.style.left = x + 'px'; no.style.top = y + 'px';
    }
    no.addEventListener('mouseenter', dodge);
    no.addEventListener('touchstart', function (e) { e.preventDefault(); dodge(e); }, { passive: false });
    no.addEventListener('click', dodge);
  }

  function plan() {
    var chosen = null;
    card.innerHTML =
      '<div class="screen" style="align-items:stretch;text-align:left">' +
        '<h2>Yay! Let’s plan it 🎉</h2>' +
        '<form id="f" novalidate>' +
          '<label for="d">Pick a date</label><input type="date" id="d" name="date">' +
          '<label for="t">Pick a time</label><input type="time" id="t" name="time">' +
          '<span class="lbl" id="wl">What should we do?</span>' +
          '<div class="chips" role="group" aria-labelledby="wl">' +
            PLANS.map(function (p, i) { return '<button type="button" class="chip" aria-pressed="false" data-i="' + i + '">' + p[1] + ' ' + p[0] + '</button>'; }).join('') +
          '</div>' +
          '<button class="btn go" id="go" type="submit" disabled>It’s a date! 💕</button>' +
        '</form>' +
      '</div>';
    var d = document.getElementById('d'), t = document.getElementById('t'), go = document.getElementById('go'), f = document.getElementById('f');
    var chips = card.querySelectorAll('.chip');
    function check() { go.disabled = !(d.value && t.value && chosen !== null); }
    d.addEventListener('input', check); t.addEventListener('input', check);
    chips.forEach(function (c) {
      c.addEventListener('click', function () {
        chips.forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        c.setAttribute('aria-pressed', 'true'); chosen = +c.dataset.i; check();
      });
    });
    f.addEventListener('submit', function (e) {
      e.preventDefault(); if (go.disabled) return;
      done(d.value, t.value, PLANS[chosen]);
    });
  }

  function fmtDate(v) {
    var p = v.split('-'); var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function fmtTime(v) {
    var p = v.split(':'), h = +p[0], m = p[1];
    return ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
  }

  function done(date, time, p) {
    card.innerHTML =
      '<div class="screen">' + heart('sm') +
        '<h2>It’s a date! 💕</h2>' +
        '<dl class="ticket" style="margin:0">' +
          '<div class="row"><dt>When</dt><dd>' + fmtDate(date) + '</dd></div>' +
          '<div class="row"><dt>Time</dt><dd>' + fmtTime(time) + '</dd></div>' +
          '<div class="row"><dt>Plan</dt><dd>' + p[1] + ' ' + p[0] + '</dd></div>' +
        '</dl>' +
        '<p class="note">Can’t wait to see you 🥰</p>' +
        '<button class="btn again" id="again" type="button">Start over ↺</button>' +
      '</div><div class="confetti" id="cf" aria-hidden="true"></div>';
    document.getElementById('again').addEventListener('click', ask);
    var cf = document.getElementById('cf'), cols = ['#f0306e', '#0b2fe0', '#ffd21f', '#fbf9f2'];
    for (var i = 0; i < 26; i++) {
      var s = document.createElement('i');
      s.style.left = Math.random() * 100 + '%'; s.style.background = cols[i % 4];
      s.style.animationDelay = Math.random() * .5 + 's'; cf.appendChild(s);
    }
  }

  ask();
})();
</script>
